server:
  port: 8080

spring:
  application:
    name: chimba-backend
  datasource:
    url: jdbc:mysql://localhost:3306/chimba_invoicing?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: ""
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false

logging:
  level:
    com.chimba: INFO
